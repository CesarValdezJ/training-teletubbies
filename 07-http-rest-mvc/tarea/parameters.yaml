courseId:
  name: id
  in: path
  required: true
  schema:
    type: string
    format: uuid
  description: Identificador del curso.

instructor:
  name: instructor
  in: query
  required: false
  schema:
    type: string
  description: Filtra los cursos por nombre del instructor.

page:
  name: page
  in: query
  required: false
  schema:
    type: integer
    minimum: 1
    default: 1

pageSize:
  name: pageSize
  in: query
  required: false
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 20