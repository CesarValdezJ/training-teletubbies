CourseInput:
  content:
    application/json:
      schema:
        type: object
        properties:
          title:
            type: string
          instructor:
            type: string
          capacity:
            type: integer
            minimum: 1
        required: [title, instructor, capacity]

CoursePatch:
  content:
    application/json:
      schema:
        type: object
        description: Todos los campos son opcionales; solo se actualizan los que vienen.
        properties:
          title:
            type: string
          instructor:
            type: string
          capacity:
            type: integer
            minimum: 1

EnrollmentInput:
  content:
    application/json:
      schema:
        type: object
        properties:
          studentName:
            type: string
            minLength: 1
        required: [studentName]